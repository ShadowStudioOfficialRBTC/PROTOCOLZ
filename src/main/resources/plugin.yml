name: ProtocolZ
version: 1.2.0
main: com.shadowstudios.protocolz.ProtocolZ
api-version: "26.3"
description: Emergency containment plugin for Paper 26.3 servers.
commands:
  protocolz:
    description: Execute ProtocolZ emergency containment commands.
    usage: /protocolz <cpt|cptr|relese|reload>
    permission: protocolz.use
permissions:
  protocolz.use:
    description: Allows using /protocolz commands.
    default: op
