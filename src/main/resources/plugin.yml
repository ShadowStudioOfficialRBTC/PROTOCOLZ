name: ProtocolZ
version: 1.3.0
main: com.shadowstudios.protocolz.ProtocolZ
api-version: "26.3"
description: Emergency Paper containment with command-block and TNT shutdown.
commands:
  protocolz:
    description: Execute ProtocolZ emergency containment commands.
    usage: /protocolz <cpt|cptr|releaseud|releseud|release|relese|reload>
    permission: protocolz.use
permissions:
  protocolz.use:
    description: Allows using /protocolz commands.
    default: op
